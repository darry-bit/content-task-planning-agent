[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "content-task-agent"
version = "0.1.0"
description = "An auditable content-planning agent with budget and deadline guards"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
content-agent = "content_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
content_agent = ["data/*.json"]
